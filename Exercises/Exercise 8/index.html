<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounce Animation</title>
    <style>
        .container {
            background-color: #f3c8c0;
            height: 80vh;
            width: 100vw;
            /* display: flex;
            justify-content: center; */
            /* align-items: center; */
            position: relative;
        }

        .box {
            background-color: #982220;
            border: 2px solid #faf8f4;
            width: 50px;
            height: 50px;
            border-radius: 100px;
            position: absolute;
            /* display: flex;
            justify-content: center;
            align-items: center; */
            color: antiquewhite;

            animation: animateX 3s linear infinite, animateY 1s ease-out infinite alternate;

            /* animation: name duration timing-function delay iteration-count direction fill-mode; */


            /* animation-name: myAnimation; */
            /* animation-name: animation2; */
            /* animation-duration: 1s;
            animation-iteration-count: infinite; */
            /* animation-timing-function: cubic-bezier(1, -0.14, 0.97, 1.01); */


            /*Simple harmonic motion of bounce animation*/
            /* animation-timing-function: ease-in; */
            /* animation-timing-function: cubic-bezier(0.25, 0.01, 0.55, 0.16); */


            /* animation-direction: alternate; */


            /* animation-play-state: paused; */

        }


        /* Animation */
        /* @keyframes myAnimation {
            form {
                background-color: #982220;
            }

            to {
                background-color: black;
                transform: translateY(50vh);
            }
        } */


        @keyframes animateX {
            from {
                left: 0;
            }

            to {
                left: 100%;
            }
        }

        @keyframes animateY {
            from {
                bottom: 0;
            }

            to {
                bottom: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">Ball</div>
    </div>

</body>

</html>
