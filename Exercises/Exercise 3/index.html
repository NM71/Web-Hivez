<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #eaeff1;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            display: flex;
            justify-content: center;

        }

        .card {
            border: 1px solid #c1d1dc;
            background-color: #ffffff;

            border-radius: 10px;
            padding: 10px;
            margin: 20px 40px;
            width: 330px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card img {
            border-radius: 10px;
        }

        div {
            display: inline-block;
            width: 100%;
        }

        .chip {
            border: 1px solid lightgray;
            border-radius: 30px;
            padding: 5px 15px;
            color: gray;
            font-weight: bold;
        }

        button {
            background-color: #e0efff;
            padding: 15px 30px;
            border-radius: 30px;
            color: #499eff;
            font-weight: 700;
            border: 1px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="card">
        <img src="1.png" alt="An image of a lake" height="250px" width="330px">
        <br>

        <div>
            <!-- <span class="chip">Nature</>
            <span class="chip">Lake</> -->
            <span class="chip">Nature</span>
            <span class="chip">Lake</span>
        </div>
        <br>

        <div>
            <h1 style="font-weight: 500;">Lago di Braies</h1>
            <br>
            <p style="color: gray;">Lorem ipsum, dolor sit amet consectetur adipisicing elit. Incidunt, eius omnis vero
                sed hic repudiandae
                explicabo harum expedita vel, facilis quaerat non deleniti, eligendi soluta delectus laboriosam
                aspernatur! Voluptatum, enim.</p>
        </div>
        <br><br>
        <button>Read more</button>
    </div>

</body>

</html>
