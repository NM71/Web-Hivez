<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Dev.Lab</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg fixed-top navbar-dark scrolled">
        <div class="container">
            <a class="navbar-brand" href="index.html">Dev<span class="text-cyan">.Lab</span></a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
                    <li class="nav-item"><a class="nav-link" href="portfolio.html">Work</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="py-5" style="margin-top: 6rem;">
        <div class="container">
            <div class="row justify-content-center reveal">
                <div class="col-lg-6">
                    <h2 class="fw-bold mb-3 text-center">Tell us about your project.</h2>
                    <p class="text-sub text-center mb-5">Fill out the form below, and we will get back to you within 24
                        hours.</p>

                    <div class="glass-card">
                        <form>
                            <div class="mb-3">
                                <label class="form-label text-sub small">Name</label>
                                <input type="text" class="form-control bg-dark border-dark text-white shadow-none"
                                    style="border-radius: var(--radius-main);">
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-sub small">Email Address</label>
                                <input type="email" class="form-control bg-dark border-dark text-white shadow-none"
                                    style="border-radius: var(--radius-main);">
                            </div>
                            <div class="mb-4">
                                <label class="form-label text-sub small">Project Details</label>
                                <textarea class="form-control bg-dark border-dark text-white shadow-none" rows="4"
                                    style="border-radius: var(--radius-main);"></textarea>
                            </div>
                            <button type="button" class="btn btn-primary-glow w-100">Send Message</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
