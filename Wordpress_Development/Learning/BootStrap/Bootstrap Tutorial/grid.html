<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


    <title>Grid Layout</title>
</head>

<body>

    <!-- Basic Grid -->
    <div class="container-lg my-5">
        <h2>Basic Grid</h2>
        <!-- To draw a basic grid, use the .row class to create a horizontal group of columns -->
        <div class="row">
            <div class="col">
                <div class="p-5 bg-primary text-light">Column 1</div>
            </div>

            <div class="col">
                <div class="p-5 bg-secondary text-light">Column 2</div>
            </div>

            <div class="col">
                <div class="p-5 bg-success text-light">Column 3</div>
            </div>
            <div class="col">
                <div class="p-5 bg-danger text-light">Column 4</div>
            </div>
        </div>


    </div>

    <hr>
    <hr>


    <div class="container-lg my-5">
        <h2>Column Widths</h2>
        <!-- We can specify the width of each column using the .col-* (like col-3, col-12, col-8 upto col-12) classes -->

        <div class="row">
            <!-- To specify width of an element give its col property a value from 1-12 -->
            <!-- like col-1, col-2, col-3 etc -->
            <div class="col-5">
                <div class="p-5 text-light" style=" background-color: cadetblue;">Column-5</div>
            </div>
            <div class="col-4">
                <div class="p-5   text-light" style="background-color: brown;">Column-4</div>
            </div>
            <div class="col-3">
                <div class="p-5 bg-transparent border text-black">Column-3</div>
            </div>

        </div>

    </div>
    <hr>
    <hr>



    <div class="container-lg my-5">
        <h2>Responsive Column Widths</h2>
        <div class="row">
            <!-- Specify responsice width of an element give its col property a value from 1-12 -->
            <!-- like col-sm-5, col-md-4, col-lg-3 etc -->

            <!-- col-sm-5 means on small screens and up, this column will take up 5 out of 12 columns -->
            <!-- col-md-4 means on medium screens and up, this column will take up 4 out of 12 columns -->
            <!-- col-lg-3 means on large screens and up, this column will take up 3 out of 12 columns -->

            <div class="col-sm-5 col-lg-6">
                <div class="p-5 text-light" style=" background-color: cadetblue;">Column-5</div>
            </div>
            <div class="col-sm-4 col-lg-3">
                <div class="p-5   text-light" style="background-color: brown;">Column-4</div>
            </div>
            <div class="col-sm-3 col-lg-3">
                <div class="p-5 bg-transparent border text-black">Column-3</div>
            </div>

        </div>
    </div>
    <hr>
    <hr>


    <div class="container-lg my-5">
        <h2>Justifying Columns</h2>

        <div class="row justify-content-around">
            <div class="col-md-3">
                <div class="p-5 bg-primary text-light">Column 1</div>
            </div>
            <div class="col-md-3">
                <div class="p-5 bg-primary text-light">Column 2</div>
            </div>
            <div class="col-md-3">
                <div class="p-5 bg-primary text-light">Column 3</div>
            </div>
        </div>

    </div>




    <!-- ---------------------------------------------------------------------------- -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
