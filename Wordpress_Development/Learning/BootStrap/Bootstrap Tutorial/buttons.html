<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Buttons and Button Groups</title>
</head>

<body>
    <!-- Basic Buttons -->
    <h2>Basic Buttons</h2>
    <br><br>
    <button class="btn btn-primary">Primary Button</button>
    <button class="btn btn-secondary">Secondary Button</button>
    <button class="btn btn-danger">Dangerous Button</button>

    <hr>
    <hr>


    <!-- anchor tags as buttons -->
    <h2 class="display-4">Links as buttons</h2>
    <br><br>
    <a href="https://www.google.com" class="btn btn-info">Google</a>

    <a href="https://getbootstrap.com/docs/4.0/components/buttons/" target="_blank" class="btn btn-success">Anchor Tag
        Button</a>

    <hr>
    <hr>


    <!-- Buttons Sizes -->
    <h2>Button Sizes</h2>
    <br><br>
    <button class="btn btn-danger btn-lg">Large Dangerous Button</button>
    <button class="btn btn-warning btn-sm">small warning Button</button>
    <button class="btn btn-danger btn-lg">Large Dangerous Button</button>


    <hr>
    <hr>
    <!-- Button Styles -->
    <h2>Button Styles</h2>
    <button class="btn btn-outline-primary btn-lg">primary outlined button</button>
    <button class="btn btn-outline-secondary btn-lg">secondary outlined button</button>
    <br><br>

    <hr>
    <hr>

    <!-- Button Groups -->
    <h2>Button Groups</h2>
    <br><br>
    <div class="btn-group">
        <!-- Bootstrap styles button groups a bit differently -->
        <a href="#" class="btn btn-primary">Button 1</a>
        <a href="#" class="btn btn-secondary">Button 2</a>
        <a href="#" class="btn btn-success">Button 3</a>
    </div>


    <hr>
    <hr>
    <!-- --------------------------------------------------------------------------------------- -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
