<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>
    <style>
        /* Simple Selector */
        /* div {
            background-color: rebeccapurple;
            color: wheat;
        } */

        /* Class Selector */
        .purple {
            background-color: rebeccapurple;
            color: wheat;
        }

        /* Attribute Selector */
        [data-x=a] {
            background-color: red;
            color: thistle;
        }

        /* Id Selector */
        #eminem {
            background-color: saddlebrown;
            color: white;
        }

        /* Child Selectors */
        div>p {
            background-color: indigo;
            color: whitesmoke;
        }

        /* Descendent Selector (this will apply css on h1 directly) */
        div h1 {
            background-color: indigo;
            color: whitesmoke;
        }

        /* Universal Selector */
        * {
            margin: 20px;
            border: 1px solid black;
        }

        /* Pseudo selectors (e.g., :hover, :focus) */
    </style>
</head>

<body>

    <div class="purple">My name is Eminem (Class Selector applied here)</div>
    <div id="eminem">I'm slim shaddy (Id Selector applied here)</div>

    <div>
        <article>
            <p data-x="a">This is an example of Child Selectors (Attribute Selector applied here)</p>
        </article>
    </div>
    <div>
        <h1>This is an example for descendent selectors</h1>
    </div>
</body>

</html>
