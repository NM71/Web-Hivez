<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>More on CSS Selectors</title>
    <style>
        /* .box:first-child {
            background-color: red;
        } */

        /* .box:first-line {
            color: yellow;
        } */

        .boxes * {
            color: blue;
            border: 2px solid yellow;
            padding: 20px;
        }

        [data-color="primary"] {
            margin-top: 30px;
        }

        /* before after selectors */

        .boxes::before {
            background-color: darkblue;
            content: "This content appears before the main content";
            color: bisque;
        }

        .boxes::after {
            background-color: darkblue;
            content: "This content appears after the main content";
            color: bisque;
        }
    </style>
</head>

<body>

    <div class="boxes">
        <div class="box">erspiciatis sequi minus illum omnis sint voluptatibus quasi.</div>
        <div data-color="primary" class="box">I am a box</div>
        <div class="box">I am a box</div>

    </div>

</body>

</html>
