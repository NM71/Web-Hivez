<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid - An Ultimate Masterclass</title>
    <style>
        .container {
            border: 2px solid black;
            display: grid;
            grid-template-columns: [pehla] 200px [doosra] 200px;
            grid-template-rows: 120px 120px 120px;

        }

        .item {
            border: 2px solid red;
            height: 100px;
            width: 100px;
        }

        .item1 {
            grid-row: 1/2;
            grid-column: 1/2;
            background-color: red;

        }
    </style>
</head>

<body>
    <h1>This is CSS Grid Masterclass</h1>

    <div class="container">
        <div class="item item1">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item item4">4</div>
        <div class="item">5</div>
        <div class="item">6</div>

    </div>

</body>

</html>
