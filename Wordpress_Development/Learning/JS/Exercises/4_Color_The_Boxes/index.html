<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color the boxes</title>
    <style>
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        .box {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100px;
            height: 100px;
            margin: 30px;
            padding: 10px;
            border: 1px solid black;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <!-- In this exercise we have to color the boxes using JS methods -->
    <!-- Assign a random color and random background to each box using the DOM concepts -->




    <div class="container">
        <div class="box">Box1</div>
        <div class="box">Box2</div>
        <div class="box">Box3</div>
        <div class="box">Box4</div>
        <div class="box">Box5</div>
    </div>

    <script src="script.js"></script>
</body>

</html>
