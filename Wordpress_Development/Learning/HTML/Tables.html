<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables in HTML</title>
</head>

<body>

    <h1>Tables in HTML</h1>
    <!-- Table is tag is the primary tag for creating tables in HTML -->
    <table>
        <!-- thead is table header -->
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Salary</th>
            </tr>
        </thead>
        <!-- tbody is the body of the table -->
        <tbody>
            <tr>
                <td>Nousher Murtaza</td>
                <td>Intern</td>
                <td>Rs 20000</td>
            </tr>

            <tr>
                <td>Nouraiz Murtaza</td>
                <td>Developer</td>
                <td>Rs 60000</td>
            </tr>

            <tr>
                <td>Ali Murtaza</td>
                <td>Manager</td>
                <td>Rs 100000</td>
            </tr>


        </tbody>
    </table>
</body>

</html>
