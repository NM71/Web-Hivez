<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>

<body>
    <header>
        <h1>Displaying the Audio and Videos</h1>
    </header>

    <section>
        <h2>Audio Files</h2>
        <audio src="audio files/1.mp3" controls></audio>
        <audio src="audio files/2.mp3" controls></audio>
        <audio src="audio files/3.mp3" controls></audio>
        <audio src="audio files/4.mp3" controls></audio>
        <audio src="audio files/5.mp3" controls></audio>
        <audio src="audio files/6.mp3" controls></audio>
    </section>

    <section>
        <h2>Video Files</h2>
        <video src="video files/1.mp4" controls width="480"></video>
        <video src="video files/2.mp4" controls width="480"></video>
        <video src="video files/3.mp4" controls width="480"></video>
        <video src="video files/4.mp4" controls width="480"></video>
        <video src="video files/5.mp4" controls width="480"></video>
    </section>

</body>

</html>
