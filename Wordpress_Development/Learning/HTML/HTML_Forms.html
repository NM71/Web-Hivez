<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms in HTML</title>
</head>

<body>
    <h1>Forms in HTML</h1>
    <a style="color: red; font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif; font-size: larger;"
        href="https://www.w3schools.com/html/">Visit our HTML tutorial</a>
    <!-- "action" attributes specifies where to send the form data when submitted -->
    <form action="/submit.php">Submit</form>
    <p style="font-size: 20px;">Steve Jobs once said:</p>
    <blockquote style="font-size :40px;" cite="https://www.google.com">
        "Innovation distinguishes between a leader and a follower."
    </blockquote>

    <q>(This is using the q tag) Innovation distinguishes between a leader and a follower.</q>
</body>

</html>
