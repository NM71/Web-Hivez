<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists in HTML</title>
</head>

<body>

    <h1>Lists in HTML</h1>

    <h2>Ordered Lists</h2>

    <ol>
        <li>Step 1</li>
        <li>Step 2</li>
        <li>Step 3</li>
    </ol>

    <h2>Unordered Lists</h2>
    <ul>
        <li>Item A</li>
        <li>Item B</li>
        <li>Item C</li>
    </ul>


    <!-- Definition Lists -->
    <!-- dl tag is primary tag for this list type -->
    <!-- dt and dd are subtags for definition and description -->

    <h2>Definition Lists</h2>
    <dl>
        <dt>Name</dt>
        <dd>Nousher Murtaza</dd>

        <dt>Address</dt>
        <dd>123 Main Street</dd>

        <dt>Phone</dt>
        <dd>555-1234</dd>
    </dl>
</body>

</html>
