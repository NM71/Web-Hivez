<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Custom Slider | JS & jQuery</title>
</head>

<body>


    <!-- Custom Slider using JS and jQuery -->
    <div class="container my-5 py-4">
        <div class="container-lg-6 rounded-4 bg-warning">
            <div class="row align-items-center justify-content-center g-5">
                <!-- Images Column -->
                <div class="col-lg-6 d-flex justify-content-center">
                    <div class="slider-images">
                        <div class="image-card active" data-index="0">
                            <img src="/Tasks/Slider_using_JS_jQuery/assets/1.png" alt="David Meltzer">
                        </div>
                        <div class="image-card next" data-index="1">
                            <img src="/Tasks/Slider_using_JS_jQuery/assets/4.png" alt="Voice 2">
                        </div>
                        <div class="image-card far-next" data-index="2">
                            <img src="/Tasks/Slider_using_JS_jQuery/assets/3.png" alt="Voice 3">
                        </div>
                        <div class="image-card furthest-next" data-index="3">
                            <img src="/Tasks/Slider_using_JS_jQuery/assets/5.png" alt="Voice 4">
                        </div>
                    </div>
                </div>

                <!-- Content Column -->
            </div>
        </div>
    </div>




    <!-- ============================================================================== -->
    <script src="jquery-4.0.0.min.js"></script>

    <script src="script.js"></script>

</body>

</html>
