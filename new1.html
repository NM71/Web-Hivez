<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Positioning Practice</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;


        }

        .book {
            width: 150px;
            height: 150px;
            border: 2px solid black;
            /* position: absolute; */
            display: flex;
            justify-content: center;
        }

        .book1 {
            background-color: red;
            position: sticky;
            top: 0px;
            left: 0px;
        }

        .book2 {
            background-color: blue;
            top: 75px;
            left: 75px;
        }

        .book3 {
            background-color: green;
            top: 20px;
            left: 20px;
        }

        .book4 {
            background-color: yellow;
            top: 30px;
            left: 30px;
        }

        .book5 {
            background-color: orange;
            top: 40px;
            left: 40px;
        }

        .book6 {
            background-color: purple;
            top: 50px;
            left: 50px;
        }

        .book7 {
            background-color: pink;
            top: 60px;
            left: 60px;
        }

        .book8 {
            background-color: cyan;
            top: 70px;
            left: 70px;
        }
    </style>
</head>

<body>
    <div class="book book1">Book 1</div>
    <div class="book book2">Book 2</div>
    <div class="book book3">Book 3</div>
    <div class="book book4">Book 4</div>
    <div class="book book5">Book 5</div>
    <div class="book book6">Book 6</div>
    <div class="book book7">Book 7</div>
    <div class="book book8">Book 8</div>
</body>

</html>
