<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- AOS CDN Link -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <!-- Remix Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />

    <link rel="stylesheet" href="styles.css">

    <title>Kids - Kindergarten</title>
</head>

<body>


    <!-- ========================================================== -->
    <!-- Home Section -->

    <section id="home" class="fixed-top">
        <div class="container-fluid info-bar d-flex align-items-center">
            <div class="container">
                <div
                    class="contact-info d-flex flex-column flex-md-row justify-content-between align-items-center text-white gap-2 py-1 py-md-0">
                    <div class="left d-flex flex-wrap justify-content-center justify-content-md-start gap-3">
                        <div class="phone">
                            <i class="bi bi-telephone-fill pe-2"></i>
                            <span>(0761) 654-123987</span>
                        </div>
                        <div class="email">
                            <i class="bi bi-envelope pe-2"></i>
                            <span>support@kids.com</span>
                        </div>
                    </div>

                    <div class="right d-flex gap-1">
                        <i class="ri-facebook-fill" style="background-color: var(--red);"></i>
                        <i class="ri-twitter-fill" style="background-color: var(--teal);"></i>
                        <i class="ri-instagram-line" style="background-color: var(--orange);"></i>
                        <i class="ri-linkedin-fill" style="background-color: var(--light-blue);"></i>
                    </div>
                </div>
            </div>
        </div>

        <nav class="navbar navbar-expand-lg bg-white text-black shadow-sm py-2">
            <div class="container">
                <a class="navbar-brand nav-logo" href="#">
                    <img src="https://muse.rometheme.pro/kids/images/logo.png?crc=3788995009" class="img-fluid"
                        alt="Kids Logo">
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-items="#navbarNav"
                    data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                    <div class="custom-navbar-links">
                        <ul class="navbar-nav align-items-center pt-3 pt-lg-0 gap-2 gap-lg-0">
                            <li class="nav-item active">Home</li>
                            <li class="nav-item">About Us</li>
                            <li class="nav-item">Classes</li>
                            <li class="nav-item">Teachers</li>
                            <li class="nav-item">Gallery</li>
                            <li class="nav-item">Contact Us</li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>



        <!-- Home Carousel -->
        <!-- Bootstrap Carousel Container -->
        <div id="homeSectionCarousel" class="carousel slide" data-bs-ride="carousel"
            style="height: calc(100vh - 70px);">
            <div class="carousel-inner">

                <!-- Active Slide -->
                <div class="carousel-item active h-100"
                    style="background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), url('https://muse.rometheme.pro/kids/images/homeslide.jpg?crc=447550241') no-repeat center center / cover;">

                    <!-- Left-Aligned Content Container -->
                    <div class="container h-100 d-flex align-items-center">
                        <div class="carousel-content text-start text-white p-4"
                            style="max-width: 550px; margin-top: 50px;">

                            <!-- Small Orange Tagline -->
                            <h6 class="fw-bold text-uppercase mb-3" style="letter-spacing: 1px; color: var(--red);">
                                Welcome to
                                Kids</h6>

                            <!-- Big Bold Main Title -->
                            <h1 class="display-4 fw-bold mb-4 text-white lh-sm">Special Program from Expert Teacher</h1>

                            <!-- Red Learn More Button -->
                            <a href="#" class="btn btn-danger px-4 py-2 rounded-pill fw-bold text-uppercase mb-4"
                                style="background-color: #ff4a4a; border: none; font-size: 0.85rem; letter-spacing: 1px;">
                                Learn More
                            </a>

                            <!-- Grouped Arrow Buttons -->
                            <div class="d-flex gap-2 mt-2">
                                <button class="custom-carousel-btn" type="button" data-bs-target="#homeSectionCarousel"
                                    data-bs-slide="prev">
                                    <span>&#10094;</span>
                                </button>
                                <button class="custom-carousel-btn" type="button" data-bs-target="#homeSectionCarousel"
                                    data-bs-slide="next">
                                    <span>&#10095;</span>
                                </button>
                            </div>

                        </div>
                    </div>

                </div>

            </div>
        </div>

    </section>


    <!-- ========================================================== -->




    <!-- ========================================================== -->






    <!-- ========================================================== -->
    <!-- Bootstrap Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- AOS JS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>


    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        AOS.init();
    </script>

    <script src="script.js"></script>
</body>

</html>
